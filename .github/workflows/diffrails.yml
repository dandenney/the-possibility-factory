name: diffrails

on:
  push:
    branches: [main]
    paths: ["projects/git-diff-guardrails/**", ".github/workflows/diffrails.yml"]
  pull_request:
    paths: ["projects/git-diff-guardrails/**", ".github/workflows/diffrails.yml"]

defaults:
  run:
    working-directory: projects/git-diff-guardrails

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: projects/git-diff-guardrails/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: projects/git-diff-guardrails/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
