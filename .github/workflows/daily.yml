name: Daily signals and ideas

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      generate:
        description: Generate ideas after collecting
        type: boolean
        default: true

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect signals
        run: pnpm --filter @factory/sources collect
      - name: Generate ideas
        if: github.event_name == 'schedule' || inputs.generate
        run: pnpm --filter @factory/ideas generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
