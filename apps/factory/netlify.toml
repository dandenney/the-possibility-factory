# Netlify site settings: Base directory = (repo root), Package directory = apps/factory
# Paths here resolve from the base directory (repo root), not the package directory.
[build]
  command = "pnpm turbo run build --filter=@factory/app"
  publish = "apps/factory/dist"
  # Skip builds (and PR previews) for commits that only touch projects/*, which deploy as their own sites.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)projects'"
