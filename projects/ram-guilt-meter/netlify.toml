# Netlify site "ram-guilt-meter", base directory projects/ram-guilt-meter.
[build]
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"
  # Only rebuild when this project changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22.22.0"

# Cross-origin isolation unlocks performance.measureUserAgentSpecificMemory() in Chromium.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
