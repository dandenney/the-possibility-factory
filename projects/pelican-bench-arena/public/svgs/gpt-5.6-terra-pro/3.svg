      <stop offset="0%" stop-color="#8ed9ff"/>
      <stop offset="100%" stop-color="#e9f9ff"/>
    </linearGradient>

    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd96d"/>
      <stop offset="100%" stop-color="#f29d38"/>
    </linearGradient>

    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6a37c"/>
      <stop offset="100%" stop-color="#df6d5f"/>
