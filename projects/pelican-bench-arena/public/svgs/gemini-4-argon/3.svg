    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65" />
      <stop offset="50%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>

    <linearGradient id="beakTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="80%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>

    <linearGradient id="bodyShade" x1="0%" y1="0%" x2="0%" y2="100%">
