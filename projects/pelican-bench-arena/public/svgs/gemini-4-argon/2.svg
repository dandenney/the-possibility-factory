<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ec5fc" />
      <stop offset="60%" stop-color="#e0c3fc" />
      <stop offset="100%" stop-color="#ffecd2" />
    </linearGradient>
    
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="100%" stop-color="#fecfef" />
    </linearGradient>

    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1" />
      <stop offset="100%" stop-color="#fbc2eb" />
    </linearGradient>

    
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f3f6f9" />
      <stop offset="100%" stop-color="#d5e0ea" />
    </linearGradient>

    <linearGradient id="beakTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd200" />
      <stop offset="70%" stop-color="#f7971e" />
      <stop offset="100%" stop-color="#ff512f" />
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9a44" />
      <stop offset="50%" stop-color="#fc6076" />
      <stop offset="100%" stop-color="#c94b4b" />
    </linearGradient>

    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8008" />
      <stop offset="100%" stop-color="#ffc837" />
