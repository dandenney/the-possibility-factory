# Netlify site "pelican-bench-arena", base directory projects/pelican-bench-arena.
[build]
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"
  # Only rebuild when this project changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22.22.0"

[functions]
  directory = "netlify/functions"

# Model-written SVGs are sanitized at generation time; this is the backstop if one is opened directly.
[[headers]]
  for = "/svgs/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; img-src data:"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600"
